[package]
name = "crisp"
authors = ["Glenn Wallace <glennw-coding@proton.me>"]
description = "A small, expressive Lisp-inspired programming language."
version = "0.5.0"
edition = "2024"
keywords = ["compiler", "interpreter", "lisp", "programming-language"]
categories = ["compilers", "parser-implementations"]
license = "MIT"
repository = "https://codeberg.org/Stack-Syndicate/crisp"

[workspace]
resolver = "2"
members = [".", "crisp-macro", "crisp-runtime"]

[dependencies]
anyhow = "1.0.104"
ariadne = { version = "0.6.0" }
chumsky = "0.13.0"
clap = { version = "4.6.6", features = ["derive", "string", "color"] }
colored = "3.1.1"
crisp-runtime = { version = "0.5.0", path = "./crisp-runtime" }
inkwell = { version = "0.10.0", features = ["llvm22-1"] }
thiserror = "2.0.20"
